<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偏移尺寸线 · 格式与显示面板</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #f1f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 22px 30px 30px 30px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            max-width: 1200px;
            width: fit-content;
            margin: 0 auto;
        }
        h1 {
            font-weight: 400;
            font-size: 1.6rem;
            color: #0f1a2e;
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 0.8rem;
            font-weight: 300;
            color: #49638b;
            background: #eef3fa;
            padding: 2px 14px;
            border-radius: 40px;
        }
        .canvas-wrapper {
            background: #fafcff;
            border-radius: 20px;
            border: 1px solid #e2e9f2;
            padding: 8px;
            display: inline-block;
            margin: 10px 0 6px 0;
            position: relative;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: white;
            border-radius: 16px;
            width: 880px;
            height: 440px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
        }
        .scale-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 14px 6px 14px;
            margin-top: 2px;
        }
        .scale-bar label {
            font-size: 0.78rem;
            font-weight: 500;
            color: #2c3d5a;
        }
        .scale-bar input[type="range"] {
            width: 140px;
            height: 4px;
            accent-color: #1f4f8a;
            cursor: pointer;
        }
        .scale-value {
            min-width: 36px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1a2c44;
            text-align: center;
        }
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 12px 24px;
            margin: 6px 0 12px 0;
            padding: 12px 24px;
            background: #f8fafc;
            border-radius: 48px;
            border: 1px solid #e6ecf3;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 10px;
        }
        .input-group label {
            font-size: 0.78rem;
            font-weight: 500;
            color: #2c3d5a;
            letter-spacing: 0.2px;
        }
        .input-group input {
            width: 68px;
            padding: 6px 6px;
            border: 1px solid #ccd7e5;
            border-radius: 30px;
            font-size: 0.9rem;
            background: white;
            transition: 0.15s;
            text-align: center;
        }
        .input-group input:focus {
            outline: none;
            border-color: #1f4f8a;
            box-shadow: 0 0 0 3px rgba(31, 79, 138, 0.15);
        }
        .coord-label {
            font-size: 0.75rem;
            color: #4a6582;
            font-weight: 500;
            margin-right: 2px;
        }
        .panels-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 6px 0 4px 0;
        }
        .panel {
            border-radius: 20px;
            padding: 14px 22px;
            flex: 1 1 auto;
            min-width: 200px;
        }
        .panel-title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #1f3b5c;
        }
        .format-panel {
            background: #e8f0fe;
            border: 1px solid #c5d8f0;
        }
        .format-panel .panel-title {
            color: #1a4a7a;
        }
        .format-panel .input-group label {
            color: #1f3b5c;
        }
        .format-panel .input-group input {
            width: 60px;
        }
        .format-panel .input-group {
            margin-bottom: 4px;
        }
        .format-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 18px;
        }
        .format-row .input-group input[type="text"] {
            width: 80px;
        }
        .format-row .input-group input[type="number"] {
            width: 60px;
        }
        .format-row .input-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #1f4f8a;
        }
        .display-panel {
            background: #f3edfc;
            border: 1px solid #dcccf0;
        }
        .display-panel .panel-title {
            color: #5a3d7a;
        }
        .display-panel label {
            font-size: 0.78rem;
            font-weight: 500;
            color: #3d2a5a;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            user-select: none;
            padding: 2px 0;
        }
        .display-panel input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #6b4a8a;
            cursor: pointer;
        }
        .display-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
        }
        .display-grid label {
            min-width: 90px;
        }
        .legend {
            font-size: 0.8rem;
            color: #3b5477;
            margin-top: 8px;
            padding-left: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px 28px;
            align-items: center;
        }
        .legend span {
            background: #eef3f9;
            padding: 2px 16px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .legend .dot {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 11px;
            margin-right: 4px;
        }
        .dot-original { background: #b33c3c; }
        .dot-offset { background: #1f6f5c; }
        .dot-translate { background: #222; }
        .dist-indicator {
            font-weight: 600;
            color: #0f2b44;
            background: #dce7f5;
            padding: 2px 18px;
            border-radius: 40px;
        }
        @media (max-width: 960px) {
            canvas { width: 100%; height: auto; aspect-ratio: 880/440; }
            .control-panel { flex-direction: column; align-items: stretch; gap: 8px; }
            .panels-row { flex-direction: column; }
            .scale-bar input[type="range"] { width: 100%; }
            .panel { min-width: unset; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        📐 偏移尺寸线 · 实时绘制
        <small>偏移 s · 线长 d = s×0.2</small>
    </h1>
    <div class="canvas-wrapper">
        <canvas id="dimCanvas" width="880" height="440"></canvas>
    </div>

    <div class="scale-bar">
        <label>🔍 缩放</label>
        <input type="range" id="scaleSlider" min="0.3" max="2.0" step="0.01" value="1.0">
        <span class="scale-value" id="scaleValue">1.00</span>
    </div>

    <div class="control-panel">
        <div class="input-group">
            <span class="coord-label">原始 A₁</span>
            <label>X</label>
            <input type="number" id="ax1" value="140" step="1">
            <label>Y</label>
            <input type="number" id="ay1" value="180" step="1">
        </div>
        <div class="input-group">
            <span class="coord-label">原始 B₁</span>
            <label>X</label>
            <input type="number" id="bx1" value="680" step="1">
            <label>Y</label>
            <input type="number" id="by1" value="280" step="1">
        </div>
    </div>

    <div class="panels-row">
        <div class="panel format-panel">
            <div class="panel-title">⚙️ 格式</div>
            <div class="format-row">
                <div class="input-group">
                    <label style="font-weight:600;">偏移 s</label>
                    <input type="number" id="offsetS" value="32" step="1" min="1" style="width:70px;">
                    <span style="color:#4a6582; font-size:0.8rem;">px</span>
                </div>
                <div class="input-group">
                    <label>点半径 r</label>
                    <input type="number" id="pointRadius" value="5" step="0.5" min="1" max="15" style="width:56px;">
                </div>
                <div class="input-group">
                    <label>文字大小 ht</label>
                    <input type="number" id="textSize" value="17" step="1" min="8" max="36" style="width:60px;">
                </div>
                <div style="color:#6a7f9a; font-size:0.75rem; border-left:2px solid #d0dcec; padding-left:12px;">
                    线长 d = s × 0.2
                </div>
            </div>
            <div class="format-row" style="margin-top:8px; border-top:1px solid #d0dcec; padding-top:8px;">
                <div class="input-group">
                    <label>前缀</label>
                    <input type="text" id="prefixText" value="" style="width:60px;">
                </div>
                <div class="input-group">
                    <label>后缀</label>
                    <input type="text" id="suffixText" value="" style="width:60px;">
                </div>
                <div class="input-group">
                    <label><input type="checkbox" id="reverseOffset" style="width:20px;height:20px;"> 标注反向</label>
                </div>
                <div class="input-group">
                    <label><input type="checkbox" id="reverseText" style="width:20px;height:20px;"> 文字反向</label>
                </div>
            </div>
        </div>

        <div class="panel display-panel">
            <div class="panel-title">👁️ 显示</div>
            <div class="display-grid">
                <label><input type="checkbox" id="showOriginal" checked> 原始点 A₁、B₁</label>
                <label><input type="checkbox" id="showOffset" checked> 偏移点 a₁、b₁</label>
                <label><input type="checkbox" id="showLabels" checked> 文字标注</label>
                <label><input type="checkbox" id="showDimText" checked> 尺寸文字</label>
            </div>
        </div>
    </div>

    <div class="legend">
        <span><span class="dot dot-original"></span> 原始点 A₁ · B₁</span>
        <span><span class="dot dot-offset"></span> 尺寸线端点 a₁ · b₁</span>
        <span><span class="dot dot-translate"></span> 平移连线 (黑色实线)</span>
        <span id="distanceDisplay" class="dist-indicator">📏 距离: —</span>
        <span style="color:#3a5a7a;">⬤ 横线 · 整数标注</span>
    </div>
</div>
<script>
    (function() {
        const canvas = document.getElementById('dimCanvas');
        const ctx = canvas.getContext('2d');

        const ax1Input = document.getElementById('ax1');
        const ay1Input = document.getElementById('ay1');
        const bx1Input = document.getElementById('bx1');
        const by1Input = document.getElementById('by1');
        const offsetInput = document.getElementById('offsetS');
        const scaleSlider = document.getElementById('scaleSlider');
        const scaleValue = document.getElementById('scaleValue');
        const pointRadiusInput = document.getElementById('pointRadius');
        const textSizeInput = document.getElementById('textSize');
        const prefixInput = document.getElementById('prefixText');
        const suffixInput = document.getElementById('suffixText');
        const reverseOffsetCheck = document.getElementById('reverseOffset');
        const reverseTextCheck = document.getElementById('reverseText');

        const showOriginal = document.getElementById('showOriginal');
        const showOffset = document.getElementById('showOffset');
        const showLabels = document.getElementById('showLabels');
        const showDimText = document.getElementById('showDimText');

        const distanceDisplay = document.getElementById('distanceDisplay');

        const OFFSET_FROM_LINE = 22;
        const LINE_EXTEND = 8;

        function drawDot(x, y, color, radius) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 1.2;
            ctx.stroke();
        }

        function drawDimensionWithOffsetAndTranslate(
            Ax1, Ay1, Bx1, By1, s, scale, pointR, textHt,
            showOrig, showOff, showLab, showDim,
            prefix, suffix, reverseOffset, reverseText
        ) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.scale(scale, scale);
            ctx.translate(-canvas.width/2, -canvas.height/2);

            if (Math.abs(Ax1 - Bx1) < 0.01 && Math.abs(Ay1 - By1) < 0.01) {
                ctx.restore();
                ctx.font = '17px "Segoe UI", system-ui, sans-serif';
                ctx.fillStyle = '#b22222';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⚠️ 原始点 A₁ 与 B₁ 重合，无法计算', 440, 200);
                distanceDisplay.textContent = '距离: — (重合)';
                return;
            }

            const dx = Bx1 - Ax1;
            const dy = By1 - Ay1;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len < 0.001) { ctx.restore(); return; }

            const ux = dx / len;
            const uy = dy / len;
            let perpX = uy;
            let perpY = -ux;

            // 标注反向：如果勾选，偏移方向取反
            if (reverseOffset) {
                perpX = -perpX;
                perpY = -perpY;
            }

            const ax = Ax1 + s * perpX;
            const ay = Ay1 + s * perpY;
            const bx = Bx1 + s * perpX;
            const by = By1 + s * perpY;

            const dist = Math.sqrt((bx - ax) ** 2 + (by - ay) ** 2);
            const distInt = Math.round(dist);
            distanceDisplay.textContent = `📏 距离: ${distInt}`;

            const d = s * 0.2;

            // 原始点
            if (showOrig) {
                drawDot(Ax1, Ay1, '#b33c3c', 5);
                drawDot(Bx1, By1, '#b33c3c', 5);
                if (showLab) {
                    ctx.font = `${Math.max(11, textHt * 0.7)}px "Segoe UI", sans-serif`;
                    ctx.fillStyle = '#a03a3a';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('A₁', Ax1 + 8, Ay1 - 4);
                    ctx.fillText('B₁', Bx1 + 8, By1 - 4);
                }
            }

            // 偏移点
            if (showOff) {
                drawDot(ax, ay, '#1f6f5c', pointR);
                drawDot(bx, by, '#1f6f5c', pointR);
                if (showLab) {
                    ctx.fillStyle = '#1a5c4a';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.font = `${Math.max(11, textHt * 0.7)}px "Segoe UI", sans-serif`;
                    ctx.fillText('a₁', ax + pointR + 6, ay - 4);
                    ctx.fillText('b₁', bx + pointR + 6, by - 4);
                }
            }

            // A₁→a₁ 和 B₁→b₁ 虚线
            ctx.setLineDash([5, 6]);
            ctx.strokeStyle = '#7f9bb3';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(Ax1, Ay1);
            ctx.lineTo(ax, ay);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(Bx1, By1);
            ctx.lineTo(bx, by);
            ctx.stroke();
            ctx.setLineDash([]);

            // 平移连线 (黑色实线)
            const dAx = ax - Ax1;
            const dAy = ay - Ay1;
            const lenA = Math.sqrt(dAx * dAx + dAy * dAy);
            if (lenA > 0.001) {
                const uAx = dAx / lenA;
                const uAy = dAy / lenA;

                const shiftX = d * uAx;
                const shiftY = d * uAy;

                const A1_shift_x = Ax1 + shiftX;
                const A1_shift_y = Ay1 + shiftY;
                const a1_shift_x = ax + shiftX;
                const a1_shift_y = ay + shiftY;
                const B1_shift_x = Bx1 + shiftX;
                const B1_shift_y = By1 + shiftY;
                const b1_shift_x = bx + shiftX;
                const b1_shift_y = by + shiftY;

                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 2.0;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(A1_shift_x, A1_shift_y);
                ctx.lineTo(a1_shift_x, a1_shift_y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(B1_shift_x, B1_shift_y);
                ctx.lineTo(b1_shift_x, b1_shift_y);
                ctx.stroke();

                if (showLab) {
                    const midX1 = (A1_shift_x + a1_shift_x) / 2;
                    const midY1 = (A1_shift_y + a1_shift_y) / 2;
                    const ang = Math.atan2(a1_shift_y - A1_shift_y, a1_shift_x - A1_shift_x);
                    const perpAng = ang + Math.PI / 2;
                    let offX = Math.cos(perpAng);
                    let offY = Math.sin(perpAng);
                    if (offY > 0) { offX = -offX; offY = -offY; }
                    const labelOff = 16;
                    const labelX = midX1 + offX * labelOff;
                    const labelY = midY1 + offY * labelOff;

                    ctx.save();
                    ctx.translate(labelX, labelY);
                    ctx.rotate(ang);
                    ctx.font = `${Math.max(11, textHt * 0.7)}px "Segoe UI", sans-serif`;
                    ctx.fillStyle = '#222';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`d=${d.toFixed(1)}`, 0, 0);
                    ctx.restore();
                }
            }

            // 尺寸线 (仅横线)
            if (showOff) {
                const angle = Math.atan2(by - ay, bx - ax);

                const startX = ax - LINE_EXTEND * Math.cos(angle);
                const startY = ay - LINE_EXTEND * Math.sin(angle);
                const endX = bx + LINE_EXTEND * Math.cos(angle);
                const endY = by + LINE_EXTEND * Math.sin(angle);

                ctx.strokeStyle = '#1a2c44';
                ctx.lineWidth = 1.8;

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                // 尺寸文字
                if (showDim) {
                    const midX = (ax + bx) / 2;
                    const midY = (ay + by) / 2;
                    const perpAngle = angle + Math.PI / 2;
                    
                    // 计算垂直方向单位向量
                    let offX2 = Math.cos(perpAngle);
                    let offY2 = Math.sin(perpAngle);
                    
                    // 文字反向：如果勾选，文字标在横线下方
                    if (reverseText) {
                        // 强制向下（Y正方向）
                        if (offY2 < 0) {
                            offX2 = -offX2;
                            offY2 = -offY2;
                        }
                    } else {
                        // 默认在上方（Y负方向）
                        if (offY2 > 0) {
                            offX2 = -offX2;
                            offY2 = -offY2;
                        }
                    }

                    const textOffset = OFFSET_FROM_LINE;
                    const textX = midX + offX2 * textOffset;
                    const textY = midY + offY2 * textOffset;

                    // 构建完整文字：前缀 + 距离 + 后缀
                    const textStr = `${prefix}${distInt}${suffix}`;
                    const fontSize = Math.max(12, textHt);
                    ctx.font = `500 ${fontSize}px "Segoe UI", Roboto, system-ui, sans-serif`;
                    const metrics = ctx.measureText(textStr);
                    const tw = metrics.width;
                    const th = fontSize * 1.2;
                    const pad = 8;

                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.shadowColor = 'rgba(0,0,0,0.02)';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.roundRect(textX - tw/2 - pad, textY - th/2 - pad/2, tw + pad*2, th + pad, 16);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.save();
                    ctx.translate(textX, textY);
                    ctx.rotate(angle);
                    ctx.fillStyle = '#0b2b44';
                    ctx.font = `500 ${fontSize}px "Segoe UI", Roboto, system-ui, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(textStr, 0, 0);
                    ctx.restore();
                }
            }

            ctx.restore();
        }

        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        function update() {
            const Ax1 = parseFloat(ax1Input.value);
            const Ay1 = parseFloat(ay1Input.value);
            const Bx1 = parseFloat(bx1Input.value);
            const By1 = parseFloat(by1Input.value);
            let s = parseFloat(offsetInput.value);
            // s 为正整数
            if (isNaN(s) || s < 1) s = 1;
            offsetInput.value = Math.round(s);
            
            const scale = parseFloat(scaleSlider.value);
            const pointR = parseFloat(pointRadiusInput.value);
            const textHt = parseFloat(textSizeInput.value);
            const prefix = prefixInput.value || '';
            const suffix = suffixInput.value || '';
            const reverseOffset = reverseOffsetCheck.checked;
            const reverseText = reverseTextCheck.checked;

            const showOrig = showOriginal.checked;
            const showOff = showOffset.checked;
            const showLab = showLabels.checked;
            const showDim = showDimText.checked;

            if (isNaN(Ax1) || isNaN(Ay1) || isNaN(Bx1) || isNaN(By1) ||
                isNaN(s) || isNaN(scale) || isNaN(pointR) || isNaN(textHt)) {
                return;
            }
            scaleValue.textContent = scale.toFixed(2);
            drawDimensionWithOffsetAndTranslate(
                Ax1, Ay1, Bx1, By1, s, scale, pointR, textHt,
                showOrig, showOff, showLab, showDim,
                prefix, suffix, reverseOffset, reverseText
            );
        }

        const allInputs = [ax1Input, ay1Input, bx1Input, by1Input, offsetInput,
                          scaleSlider, pointRadiusInput, textSizeInput,
                          prefixInput, suffixInput,
                          reverseOffsetCheck, reverseTextCheck,
                          showOriginal, showOffset, showLabels, showDimText];
        allInputs.forEach(inp => {
            inp.addEventListener('input', update);
            inp.addEventListener('change', update);
        });

        update();
    })();
</script>
</body>
</html>
